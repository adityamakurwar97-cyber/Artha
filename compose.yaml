services:
  artha:
    build: .
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?Set APP_AUTH_PASSWORD in .env before starting}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - artha-research:/app/data/runtime

volumes:
  artha-research:
